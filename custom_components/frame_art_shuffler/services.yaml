remove_tv:
  name: Remove TV
  description: Remove a TV from the Frame Art Shuffler integration
  fields:
    device_id:
      name: Device
      description: The TV device to remove
      required: true
      selector:
        device:
          integration: frame_art_shuffler

send_image:
  name: Send Image
  description: Upload an image to a Frame TV. By default (select=true), the image is selected as the current artwork and old images are cleaned up. With select=false, the image is uploaded only (for pre-upload pipeline). Always returns content_id when called with return_response.
  fields:
    device_id:
      name: Device
      description: The TV device. Required if entity_id is not provided.
      required: false
      selector:
        device:
          integration: frame_art_shuffler
    entity_id:
      name: Entity
      description: The entity ID of the TV (e.g. media_player.frame_tv). Required if device_id is not provided.
      required: false
      selector:
        entity:
          integration: frame_art_shuffler
    image_path:
      name: Image Path
      description: Full local path to the image file. Required if image_url or filename are not provided.
      required: false
      selector:
        text:
    image_url:
      name: Image URL
      description: Local URL to the image (e.g. /local/my_art.jpg). Only used when select=true.
      required: false
      selector:
        text:
    filename:
      name: Filename
      description: Filename of the image relative to the library folder. Only used when select=true.
      required: false
      selector:
        text:
    select:
      name: Select
      description: If true (default), select the image as current artwork after upload. If false, upload only.
      required: false
      default: true
      selector:
        boolean:
    screen_on:
      name: Screen On
      description: Whether to turn the screen on when selecting. Only used when select=true.
      required: false
      default: true
      selector:
        boolean:
    matte:
      name: Matte
      description: Matte ID (e.g. modern_matte, shadowbox_polar)
      required: false
      selector:
        text:
    filter:
      name: Filter
      description: Filter ID. Only used when select=true.
      required: false
      selector:
        text:
    artwork_metadata:
      name: Artwork Metadata
      description: Optional metadata dict from the add-on (web source artwork info).
      required: false
      selector:
        object:

set_log_options:
  name: Configure Display Logging
  description: Update the shared display log settings used by the Frame Art Manager dashboard.
  fields:
    logging_enabled:
      name: Enable logging
      description: Turn logging on or off without deleting existing files.
      required: false
      selector:
        boolean:
    log_retention_months:
      name: Retention window (months)
      description: Keep raw display sessions for this many months (1-12, defaults to 6).
      required: false
      selector:
        number:
          min: 1
          max: 12
          mode: slider
    log_flush_interval_minutes:
      name: Flush interval (minutes)
      description: How often queued sessions are flushed to disk (1-60, defaults to 5).
      required: false
      selector:
        number:
          min: 1
          max: 60
          mode: slider

flush_display_log:
  name: Flush Display Log
  description: Manually flush any pending display sessions to disk. Useful for testing or ensuring data is written before a restart.

clear_display_log:
  name: Clear Display Log
  description: Permanently delete all display log data including events, summary, and pending sessions. This action cannot be undone.

turn_on_tv:
  name: Turn On TV
  description: Turn on a Frame TV and switch to art mode. Supports an optional reason for activity logging.
  fields:
    device_id:
      name: Device
      description: The TV device to turn on. Required if entity_id is not provided.
      required: false
      selector:
        device:
          integration: frame_art_shuffler
    entity_id:
      name: Entity
      description: The entity ID of the TV. Required if device_id is not provided.
      required: false
      selector:
        entity:
          integration: frame_art_shuffler
    reason:
      name: Reason
      description: Optional reason for turning on (e.g., "Billy arrived home"). Appears in activity log.
      required: false
      selector:
        text:

turn_off_tv:
  name: Turn Off TV
  description: Turn off a Frame TV screen (stays in art mode). Supports an optional reason for activity logging.
  fields:
    device_id:
      name: Device
      description: The TV device to turn off. Required if entity_id is not provided.
      required: false
      selector:
        device:
          integration: frame_art_shuffler
    entity_id:
      name: Entity
      description: The entity ID of the TV. Required if device_id is not provided.
      required: false
      selector:
        entity:
          integration: frame_art_shuffler
    reason:
      name: Reason
      description: Optional reason for turning off (e.g., "Billy left home"). Appears in activity log.
      required: false
      selector:
        text:

# Tagset Assignment Services (tagset definitions are managed via the Frame Art Manager add-on)
select_tagset:
  name: Select Tagset
  description: Permanently switch which tagset a TV uses for shuffling.
  fields:
    device_id:
      name: Device
      description: The TV device. Required if entity_id is not provided.
      required: false
      selector:
        device:
          integration: frame_art_shuffler
    entity_id:
      name: Entity
      description: The entity ID of the TV. Required if device_id is not provided.
      required: false
      selector:
        entity:
          integration: frame_art_shuffler
    name:
      name: Tagset Name
      description: Name of the tagset to select.
      required: true
      selector:
        text:

override_tagset:
  name: Override Tagset
  description: Temporarily override the selected tagset for a specified duration.
  fields:
    device_id:
      name: Device
      description: The TV device. Required if entity_id is not provided.
      required: false
      selector:
        device:
          integration: frame_art_shuffler
    entity_id:
      name: Entity
      description: The entity ID of the TV. Required if device_id is not provided.
      required: false
      selector:
        entity:
          integration: frame_art_shuffler
    name:
      name: Tagset Name
      description: Name of the tagset to temporarily activate.
      required: true
      selector:
        text:
    duration_minutes:
      name: Duration (minutes)
      description: How long the override should last before reverting to the selected tagset.
      required: true
      selector:
        number:
          min: 1
          max: 10080
          unit_of_measurement: minutes
          mode: box

clear_tagset_override:
  name: Clear Tagset Override
  description: Clear an active tagset override, reverting to the selected tagset immediately.
  fields:
    device_id:
      name: Device
      description: The TV device. Required if entity_id is not provided.
      required: false
      selector:
        device:
          integration: frame_art_shuffler
    entity_id:
      name: Entity
      description: The entity ID of the TV. Required if device_id is not provided.
      required: false
      selector:
        entity:
          integration: frame_art_shuffler

set_recency_windows:
  name: Set Recency Windows
  description: Configure the recency time windows used by the shuffle algorithm to deprioritize recently shown images.
  fields:
    same_tv_hours:
      name: Same-TV Window (hours)
      description: Images shown on the same TV within this window are deprioritized. Range 6-168 (1 week).
      required: false
      selector:
        number:
          min: 6
          max: 168
          unit_of_measurement: hours
          mode: slider
    cross_tv_hours:
      name: Cross-TV Window (hours)
      description: Images shown on any TV within this window are deprioritized. Range 6-168 (1 week).
      required: false
      selector:
        number:
          min: 6
          max: 168
          unit_of_measurement: hours
          mode: slider
