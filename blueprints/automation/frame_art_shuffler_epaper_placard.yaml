blueprint:
  name: "Frame Art Shuffler — OpenEpaperLink Placard"
  description: >
    Updates an OpenEpaperLink e-paper display when the artwork changes on a
    Samsung Frame TV. Renders a museum-style placard: artist name, nationality,
    lifespan, title and date, medium, dimensions, museum, a short description,
    and a QR code linking to the full artwork info page.

    Tuned for a 4.2" 400×300 three-color (black/white/red) display.

    Server-side layout (recommended): Set the Frame Art Manager URL to enable
    pixel-accurate text measurement using real font metrics (Playfair Display,
    Roboto). Fonts are automatically installed to /config/www/fonts/ on first
    use. If the manager URL is left empty the blueprint falls back to a static
    Jinja2 layout.

    After updating this blueprint, reload automations in HA
    (Developer Tools → YAML → Reload Automations) for changes to take effect.
  domain: automation
  source_url: https://github.com/paulbroyles/frame-art-shuffler/blob/main/blueprints/automation/frame_art_shuffler_epaper_placard.yaml
  input:
    artwork_sensor:
      name: Current Artwork Sensor
      description: >
        The 'Current Artwork' sensor for the TV (sensor.*_current_artwork).
        Carries title, date, medium, museum, description, and creator fields.
      selector:
        entity:
          domain: sensor
    page_url_sensor:
      name: Artwork Page URL Sensor
      description: >
        The 'Artwork Page URL' sensor for the TV (sensor.*_artwork_page_url).
        Its full_url attribute is used for the QR code if available. If the
        attribute is missing, provide ha_base_url below instead.
      selector:
        entity:
          domain: sensor
    ha_base_url:
      name: Home Assistant Base URL (for QR code)
      description: >
        Internal URL of your HA instance (e.g. http://homeassistant.local:8123
        or http://192.168.1.x:8123). Only needed if the Artwork Page URL sensor
        does not have a full_url attribute. Leave blank if full_url is present.
      default: ""
      selector:
        text:
    manager_url:
      name: Frame Art Manager URL (for server-side layout)
      description: >
        Base URL of the Frame Art Manager add-on API. When set, uses
        server-side font metrics for accurate text layout with nicer fonts.
        Typically http://homeassistant.local:8099 or http://localhost:8099.
        Leave empty to use the built-in Jinja2 layout instead.
      default: ""
      selector:
        text:
    oel_device:
      name: OpenEpaperLink Display
      description: The e-paper display device to update.
      selector:
        device:
          integration: open_epaper_link
    display_width:
      name: Display Width (px)
      description: Pixel width of your display. Default 400 for 4.2".
      default: 400
      selector:
        number:
          min: 100
          max: 1600
          unit_of_measurement: px
    display_height:
      name: Display Height (px)
      description: Pixel height of your display. Default 300 for 4.2".
      default: 300
      selector:
        number:
          min: 100
          max: 1200
          unit_of_measurement: px
    refresh_type:
      name: Refresh Mode
      description: >
        E-paper refresh mode. Full (~2s) supports red title text and is
        required for three-color displays. Fast (~1s) and Partial (~0.3s,
        may ghost) are faster but only render black and white — select these
        only if you prefer speed over the red title color.
      default: "Full"
      selector:
        select:
          options:
            - Full
            - Fast
            - Partial
            - Partial2

# Expose blueprint inputs as template variables.
variables:
  artwork_sensor: !input artwork_sensor
  page_url_sensor: !input page_url_sensor
  ha_base_url: !input ha_base_url
  manager_url: !input manager_url
  display_width: !input display_width
  display_height: !input display_height
  refresh_type: !input refresh_type

trigger:
  - platform: state
    entity_id: !input artwork_sensor
    not_to:
      - "unknown"
      - "unavailable"

# Restart so a rapid succession of changes always renders the latest artwork.
mode: restart

action:
  # Snapshot all metadata fields at trigger time.
  - variables:
      creator_name: "{{ state_attr(artwork_sensor, 'creator_name') | default('') | string }}"
      creator_nationality: "{{ state_attr(artwork_sensor, 'creator_nationality') | default('') | string }}"
      creator_lifespan: "{{ state_attr(artwork_sensor, 'creator_lifespan') | default('') | string }}"
      title: "{{ state_attr(artwork_sensor, 'title') | default('') | string }}"
      date: "{{ state_attr(artwork_sensor, 'date') | default('') | string }}"
      medium: "{{ state_attr(artwork_sensor, 'medium') | default('') | string }}"
      dimensions: "{{ state_attr(artwork_sensor, 'dimensions') | default('') | string }}"
      museum: "{{ state_attr(artwork_sensor, 'museum') | default('') | string }}"
      description: "{{ state_attr(artwork_sensor, 'description') | default('') | string }}"
      # QR: prefer full_url attribute; fall back to ha_base_url + relative path
      page_full_url: "{{ state_attr(page_url_sensor, 'full_url') | default('') | string }}"
      artwork_url: >
        {% if page_full_url %}
          {{ page_full_url }}
        {% elif ha_base_url %}
          {{ ha_base_url.rstrip('/') }}{{ states(page_url_sensor) }}
        {% else %}
          {{ '' }}
        {% endif %}

  # ── Server-side layout (when manager_url is configured) ──────────────────
  # Calls the manager's layout engine for pixel-accurate font measurement.
  # If this succeeds, the response payload is used directly.
  # If it fails or manager_url is empty, the Jinja2 fallback below is used.

  - if:
      - condition: template
        value_template: "{{ manager_url | default('') | trim != '' }}"
    then:
      - action: frame_art_shuffler.generate_oel_payload
        data:
          sensor_entity_id: !input artwork_sensor
          artwork_url: "{{ artwork_url }}"
          display_width: !input display_width
          display_height: !input display_height
          refresh_type: !input refresh_type
          manager_url: !input manager_url
        response_variable: oel_response
        continue_on_error: true

      - if:
          - condition: template
            value_template: "{{ oel_response is defined and oel_response.payload is defined }}"
        then:
          - action: open_epaper_link.drawcustom
            target:
              device_id: !input oel_device
            data:
              background: white
              rotate: 0
              refresh_type: "{{ {'Full': 0, 'Fast': 1, 'Partial': 2, 'Partial2': 3}[refresh_type] | default(0) }}"
              payload: "{{ oel_response.payload }}"
          - stop: "Server-side layout rendered successfully"

  # ── Jinja2 fallback layout ────────────────────────────────────────────────
  # Used when manager_url is empty or the server-side call failed.
  # Uses a char-count heuristic for text wrapping (approximate).

  - action: open_epaper_link.drawcustom
    target:
      device_id: !input oel_device
    data:
      background: white
      rotate: 0
      refresh_type: "{{ {'Full': 0, 'Fast': 1, 'Partial': 2, 'Partial2': 3}[refresh_type] | default(0) }}"
      payload: >
        {% set ns = namespace(items=[], t_lines=1) %}
        {% set margin = 10 %}
        {% set qr_margin = 15 %}
        {% set content_width = display_width - margin * 2 %}
        {% set qr_size = (display_width * 0.225) | int %}
        {% set qr_x = display_width - qr_size - qr_margin %}
        {% set qr_y = display_height - qr_size - qr_margin %}
        {% set title_color = 'red' if refresh_type == 'Full' else 'black' %}

        {# ── Artist name (all caps, black, large) ─────────────────────── #}
        {% if creator_name %}
          {% set ns.items = ns.items + [
            {"type": "text", "x": margin, "y": 10,
             "value": creator_name | upper, "size": 26, "color": "black"}
          ] %}
        {% endif %}

        {# ── Nationality (size 16) and Lifespan below (size 14, parens) ── #}
        {% if creator_nationality %}
          {% set ns.items = ns.items + [
            {"type": "text", "x": margin, "y": 44,
             "value": creator_nationality, "size": 16, "color": "black"}
          ] %}
          {% if creator_lifespan %}
            {% set ns.items = ns.items + [
              {"type": "text", "x": margin, "y": 62,
               "value": "(" ~ creator_lifespan ~ ")", "size": 14, "color": "black"}
            ] %}
          {% endif %}
        {% elif creator_lifespan %}
          {# No nationality: lifespan alone at the nationality position #}
          {% set ns.items = ns.items + [
            {"type": "text", "x": margin, "y": 44,
             "value": creator_lifespan, "size": 16, "color": "black"}
          ] %}
        {% endif %}

        {# ── Title (wrapped; red on Full refresh) ─────────────────────── #}
        {# Estimate lines at size 22 (~13 px/char) to position year below. #}
        {% if title %}
          {% set cpl = (content_width / 13) | int %}
          {% set ns.t_lines = [((title | length) / cpl) | round(0, 'ceil') | int, 1] | max %}
          {% set ns.items = ns.items + [
            {"type": "text", "x": margin, "y": 84,
             "value": title, "size": 22,
             "max_width": content_width | int, "spacing": 4,
             "color": title_color}
          ] %}
        {% endif %}

        {# ── Year in parentheses (below title, size 15, black) ──────────── #}
        {% if date %}
          {% set year_y = 84 + ns.t_lines * 26 + 4 %}
          {% set ns.items = ns.items + [
            {"type": "text", "x": margin, "y": year_y,
             "value": "(" ~ date ~ ")", "size": 15, "color": "black"}
          ] %}
        {% endif %}

        {# ── Medium ───────────────────────────────────────────────────── #}
        {% if medium %}
          {% set ns.items = ns.items + [
            {"type": "text", "x": margin, "y": 162,
             "value": medium, "size": 15, "color": "black"}
          ] %}
        {% endif %}

        {# ── Dimensions ───────────────────────────────────────────────── #}
        {% if dimensions %}
          {% set ns.items = ns.items + [
            {"type": "text", "x": margin, "y": 180,
             "value": dimensions, "size": 13, "color": "black"}
          ] %}
        {% endif %}

        {# ── Museum / Collection ──────────────────────────────────────── #}
        {% if museum %}
          {% set ns.items = ns.items + [
            {"type": "text", "x": margin, "y": 197,
             "value": museum, "size": 15, "color": "black"}
          ] %}
        {% endif %}

        {# ── Description (bottom-left, beside QR) ─────────────────────── #}
        {% if description %}
          {% set desc_text = description | truncate(180, True, '...') %}
          {% set ns.items = ns.items + [
            {"type": "text", "x": margin, "y": qr_y,
             "value": desc_text, "size": 13,
             "max_width": (qr_x - margin * 2) | int, "spacing": 2,
             "color": "black"}
          ] %}
        {% endif %}

        {# ── QR code (bottom-right corner) ────────────────────────────── #}
        {% if artwork_url %}
          {% set ns.items = ns.items + [
            {"type": "qrcode", "x": qr_x, "y": qr_y,
             "data": artwork_url, "boxsize": 2, "border": 1, "color": "black"}
          ] %}
        {% endif %}

        {{ ns.items | to_json }}
